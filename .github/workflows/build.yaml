name: Campfire Android Release

on:
  workflow_dispatch:

jobs:
  build-campfire-android:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable

      - name: Configure app
        run: |
          cd scripts
          echo "yes" | ./build_app.sh \
            -v "0.0.1-test" \
            -b "1" \
            -p android \
            -a campfire \
            -d -s

      - name: Get dependencies
        run: flutter pub get

      - name: Create test API keys
        run: |
          cat > lib/external_api_keys.dart <<'EOF'
          // Test/CI values only.
          // No real API credentials are included.

          const String kShopInBitAccessKey = "";
          const String kShopInBitPartnerSecret = "";

          const String kWizSwapApiKey = "";
          const String kChangeNowApiKey = "";

          const String kCakePayApiToken = "";

          const String kNanoSwapRpcApiKey = "";

          const String kCypherGoatApiKey = "";
          const String kCypherGoatAffiliate = "";

          const String kExolixApiKey = "";

          const String kLetsExchangeToken = "";
          const String kLetsExchangeId = "";

          const String kNanswapApiKey = "";

          const String kSimpleSwapApiKey = "";
          EOF

      - name: Set up Android local.properties
        run: |
          cat > android/local.properties <<EOF
          sdk.dir=${ANDROID_SDK_ROOT}
          flutter.sdk=${FLUTTER_HOME}
          EOF

      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/keystore-orig.jks
          [ -s android/keystore-orig.jks ] || { echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is empty or not set"; exit 1; }
          keytool -importkeystore \
            -srckeystore android/keystore-orig.jks \
            -destkeystore android/keystore.jks \
            -deststoretype pkcs12 \
            -srcstorepass "${{ secrets.ANDROID_STORE_PASSWORD }}" \
            -deststorepass "${{ secrets.ANDROID_STORE_PASSWORD }}" \
            -noprompt \
            -J-Dkeystore.pkcs12.legacy
          rm android/keystore-orig.jks
          cat > android/key.properties <<EOF
          storeFile=../keystore.jks
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          EOF

      - name: Build ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Collect artifact
        run: |
          mkdir -p android-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk android-artifacts/campfire-android-arm64-v8a-0.0.1-test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: campfire-android-release-arm64-v8a
          path: android-artifacts/
