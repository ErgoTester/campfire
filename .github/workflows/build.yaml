name: Campfire Android Test

on:
  workflow_dispatch:

jobs:
  build-campfire-android:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable

      - name: Configure app
        run: |
          cd scripts
          echo "yes" | ./build_app.sh \
            -v "0.0.1-test" \
            -b "1" \
            -p android \
            -a campfire \
            -d -s

      - name: Get dependencies
        run: flutter pub get

      - name: Create test API keys
        run: |
          cat > lib/external_api_keys.dart <<'EOF'
          // Test/CI values only.
          // No real API credentials are included.

          const String kShopInBitAccessKey = "";
          const String kShopInBitPartnerSecret = "";

          const String kWizSwapApiKey = "";
          const String kChangeNowApiKey = "";

          const String kCakePayApiToken = "";

          const String kNanoSwapRpcApiKey = "";

          const String kCypherGoatApiKey = "";
          const String kCypherGoatAffiliate = "";

          const String kExolixApiKey = "";

          const String kLetsExchangeToken = "";
          const String kLetsExchangeId = "";

          const String kNanswapApiKey = "";

          const String kSimpleSwapApiKey = "";
          EOF

      - name: Build ARM64 debug APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: campfire-android-debug-arm64-v8a
          path: build/app/outputs/flutter-apk/app-debug.apk
