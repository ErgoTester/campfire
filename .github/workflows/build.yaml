name: Campfire Android Release

on:
  workflow_dispatch:

jobs:
  build-campfire-android:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable

      - name: Install required Rust toolchain
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
          rustc --version
          cargo --version

      - name: Configure app
        run: |
          cd scripts
          echo "yes" | ./build_app.sh \
            -v "0.0.1" \
            -b "1" \
            -p android \
            -a campfire \
            -s

      - name: Get dependencies
        run: flutter pub get

      - name: Create test API keys
        run: |
          cat > lib/external_api_keys.dart <<'EOF'
          // Test/CI values only.
          // No real API credentials are included.

          const String kShopInBitAccessKey = "";
          const String kShopInBitPartnerSecret = "";

          const String kWizSwapApiKey = "";
          const String kChangeNowApiKey = "";

          const String kCakePayApiToken = "";

          const String kNanoSwapRpcApiKey = "";

          const String kCypherGoatApiKey = "";
          const String kCypherGoatAffiliate = "";

          const String kExolixApiKey = "";

          const String kLetsExchangeToken = "";
          const String kLetsExchangeId = "";

          const String kNanswapApiKey = "";

          const String kSimpleSwapApiKey = "";
          EOF

      - name: Create key.properties
        run: |
          cat > android/key.properties <<'EOF'
          storePassword=campfire123
          keyPassword=campfire123
          keyAlias=campfire
          storeFile=campfire-release.jks
          EOF

      - name: Build ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: campfire-android-release-arm64-v8a
          path: build/app/outputs/flutter-apk/app-release.apk
